<main class="page">

    <div>

    </div>
    <div class="controls">
      <span class="tag" id="rail-foot">Loading gameweek…</span>
      <label class="fld">Horizon
        <select id="horizon">
          <option value="1">1 GW</option><option value="3">3 GW</option>
          <option value="5" selected>5 GW</option><option value="6">6 GW</option>
          <option value="8">8 GW</option><option value="10">10 GW</option>
        </select>
      </label>
    </div>
  </div>

  <section id="view-dashboard" class="view on"></section>
  <section id="view-xpts" class="view"></section>

  <section id="view-copilot" class="view"></section>

  <section id="view-scout" class="view"></section>
